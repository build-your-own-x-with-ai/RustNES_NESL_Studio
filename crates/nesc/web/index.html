<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NESL Studio</title>
<style>
  :root {
    --bg: #14161b; --panel: #1c1f26; --line: #2a2e38; --text: #d8dbe2; --muted: #7d8494;
    --accent: #e8483c; --accent2: #f2b134; --ok: #4fbf7a; --err: #ff6b6b;
    --kw: #c792ea; --fn: #82aaff; --num: #f78c6c; --str: #c3e88d; --com: #5c6370; --const: #ffcb6b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: .5px; }
  header h1 b { color: var(--accent); }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .spacer { flex: 1; }
  .status { color: var(--muted); font-size: 13px; }
  .status.ok { color: var(--ok); } .status.err { color: var(--err); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 540px; height: calc(100% - 53px); }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; height: auto; } .editor { height: 60vh; } }

  .editor { position: relative; display: flex; overflow: hidden; border-right: 1px solid var(--line); }
  .gutter { flex: none; width: 52px; padding: 12px 8px 12px 0; text-align: right; color: var(--muted);
    font: 13px/20px var(--mono); background: var(--panel); overflow: hidden; user-select: none; white-space: pre; }
  .gutter .bad { color: var(--err); font-weight: 700; }
  .code { position: relative; flex: 1; overflow: hidden; }
  .code pre, .code textarea { position: absolute; inset: 0; margin: 0; padding: 12px 16px; border: 0;
    font: 13px/20px var(--mono); tab-size: 4; white-space: pre; overflow: auto; }
  .code pre { pointer-events: none; color: var(--text); }
  .code textarea { background: transparent; color: transparent; caret-color: #fff; resize: none; outline: none; }
  .code textarea::selection { background: rgba(130,170,255,.3); color: transparent; }
  .tok-kw { color: var(--kw); } .tok-fn { color: var(--fn); } .tok-num { color: var(--num); }
  .tok-str { color: var(--str); } .tok-com { color: var(--com); font-style: italic; } .tok-const { color: var(--const); }
  .errline { background: rgba(255,107,107,.14); box-shadow: inset 3px 0 var(--err); display: inline-block; min-width: 100%; }

  aside { display: flex; flex-direction: column; overflow: auto; }
  .screen { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  canvas { width: 512px; height: 480px; max-width: 100%; image-rendering: pixelated; background: #000;
    border-radius: 4px; outline: 2px solid transparent; }
  canvas:focus { outline-color: var(--accent2); }
  .hint { color: var(--muted); font-size: 12px; text-align: center; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-radius: 0; background: none; padding: 8px 14px; color: var(--muted); }
  .tabs button.active { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
  .panel { flex: 1; padding: 12px 16px; font: 12px/18px var(--mono); white-space: pre; overflow: auto; min-height: 160px; }
  .panel .e { color: var(--err); cursor: pointer; white-space: pre-wrap; }
  .panel .e:hover { text-decoration: underline; }
  .panel .ok { color: var(--ok); white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1><b>NESL</b> Studio</h1>
  <select id="examples" title="载入示例"><option value="">示例…</option></select>
  <button class="primary" id="run" title="Ctrl/⌘ + Enter">▶ 编译并运行</button>
  <button id="download" disabled>⬇ 下载 .nes</button>
  <button id="mute">🔊 声音</button>
  <span class="status" id="status">就绪</span>
  <span class="spacer"></span>
  <span class="status">高级语言 → NES ROM，无需汇编</span>
</header>
<main>
  <section class="editor">
    <div class="gutter" id="gutter">1</div>
    <div class="code">
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
  </section>
  <aside>
    <div class="screen">
      <canvas id="screen" width="256" height="240" tabindex="0" title="点击此处后用键盘操作"></canvas>
      <div class="hint">点击画面获得焦点 · <kbd>←↑→↓</kbd> 方向 · <kbd>X</kbd> A · <kbd>Z</kbd> B · <kbd>Enter</kbd> Start · <kbd>Shift</kbd> Select</div>
      <div class="hint" id="emu-note"></div>
    </div>
    <div class="tabs">
      <button class="active" data-tab="problems">输出</button>
      <button data-tab="asm">汇编清单</button>
    </div>
    <div class="panel" id="problems"></div>
    <div class="panel" id="asm" hidden></div>
  </aside>
</main>
<script src="https://unpkg.com/jsnes@1.2.1/dist/jsnes.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const src = $("src"), hl = $("highlight"), gutter = $("gutter");
  const statusEl = $("status"), problems = $("problems"), asmPanel = $("asm");
  let errorLines = new Set(), romBytes = null, examples = [];

  // ---------------------------------------------------------------- editor
  const KW = /^(fn|let|var|const|tile|if|else|while|loop|for|in|break|continue|return|as|true|false|u8|u16)$/;
  const BUILTIN = /^(wait_vblank|ppu_on|ppu_off|load_palette|vram_addr|vram_put|vram_fill|print|print_u8|sprite|hide_sprite|joypad|scroll|rand|frame_count|peek|poke|play_tone|stop_sound)$/;
  const TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|\b(0x[0-9a-fA-F_]+|0b[01_]+|\d[\d_]*)\b|([A-Za-z_]\w*)/g;
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

  function highlight(text) {
    let out = "", last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(text))) {
      out += esc(text.slice(last, m.index));
      const t = esc(m[0]);
      if (m[1]) out += `<span class="tok-com">${t}</span>`;
      else if (m[2]) out += `<span class="tok-str">${t}</span>`;
      else if (m[3]) out += `<span class="tok-num">${t}</span>`;
      else if (KW.test(m[4])) out += `<span class="tok-kw">${t}</span>`;
      else if (BUILTIN.test(m[4])) out += `<span class="tok-fn">${t}</span>`;
      else if (/^[A-Z][A-Z0-9_]+$/.test(m[4])) out += `<span class="tok-const">${t}</span>`;
      else out += t;
      last = m.index + m[0].length;
    }
    out += esc(text.slice(last));
    // wrap error lines (highlight markup never spans lines except block comments; good enough)
    return out.split("\n").map((l, i) => errorLines.has(i + 1) ? `<span class="errline">${l || " "}</span>` : l).join("\n") + "\n";
  }

  function refresh() {
    hl.innerHTML = highlight(src.value);
    const n = src.value.split("\n").length;
    let g = "";
    for (let i = 1; i <= n; i++) g += (errorLines.has(i) ? `<span class="bad">${i}</span>` : i) + "\n";
    gutter.innerHTML = g;
    syncScroll();
    try { localStorage.setItem("nesl-source", src.value); } catch (e) {}
  }
  function syncScroll() { hl.scrollTop = src.scrollTop; hl.scrollLeft = src.scrollLeft; gutter.scrollTop = src.scrollTop; }

  src.addEventListener("input", () => { errorLines.clear(); refresh(); });
  src.addEventListener("scroll", syncScroll);
  src.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = src.selectionStart;
      src.setRangeText("    ", s, src.selectionEnd, "end");
      refresh();
    } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      compileAndRun();
    } else if (e.key === "Enter") {
      // keep indentation
      e.preventDefault();
      const s = src.selectionStart, before = src.value.slice(0, s);
      const indent = before.slice(before.lastIndexOf("\n") + 1).match(/^\s*/)[0] + (/\{\s*$/.test(before) ? "    " : "");
      src.setRangeText("\n" + indent, s, src.selectionEnd, "end");
      refresh();
    }
  });

  function gotoLine(line, col) {
    const lines = src.value.split("\n");
    let pos = 0;
    for (let i = 0; i < line - 1 && i < lines.length; i++) pos += lines[i].length + 1;
    pos += Math.max(0, col - 1);
    src.focus();
    src.setSelectionRange(pos, pos);
    src.scrollTop = Math.max(0, (line - 5) * 20);
  }

  // ---------------------------------------------------------------- emulator
  const canvas = $("screen"), ctx = canvas.getContext("2d");
  const image = ctx.createImageData(256, 240);
  const fb = new Uint32Array(image.data.buffer);
  let nes = null, running = false, lastTime = 0, acc = 0;
  let audio = null, muted = false;
  const SAMPLES = 8192, bufL = new Float32Array(SAMPLES), bufR = new Float32Array(SAMPLES);
  let wr = 0, rd = 0;

  function setupAudio() {
    if (audio || !window.AudioContext) return;
    audio = new AudioContext();
    const node = audio.createScriptProcessor(1024, 0, 2);
    node.onaudioprocess = (ev) => {
      const l = ev.outputBuffer.getChannelData(0), r = ev.outputBuffer.getChannelData(1);
      for (let i = 0; i < l.length; i++) {
        if (rd !== wr && !muted) { l[i] = bufL[rd]; r[i] = bufR[rd]; rd = (rd + 1) % SAMPLES; }
        else { l[i] = r[i] = 0; if (rd !== wr) rd = (rd + 1) % SAMPLES; }
      }
    };
    node.connect(audio.destination);
  }

  function makeNes() {
    return new jsnes.NES({
      sampleRate: audio ? audio.sampleRate : 44100,
      onFrame: (buf) => { for (let i = 0; i < 256 * 240; i++) fb[i] = 0xFF000000 | buf[i]; },
      onAudioSample: (l, r) => { bufL[wr] = l; bufR[wr] = r; wr = (wr + 1) % SAMPLES; },
    });
  }

  function tick(t) {
    if (!running) return;
    acc += Math.min(100, t - (lastTime || t));
    lastTime = t;
    while (acc >= 1000 / 60) { nes.frame(); acc -= 1000 / 60; }
    ctx.putImageData(image, 0, 0);
    requestAnimationFrame(tick);
  }

  function startRom(bytes) {
    if (!window.jsnes) {
      $("emu-note").textContent = "未能加载 jsnes（离线？）—— 仍可下载 .nes 用本地模拟器运行。";
      return;
    }
    setupAudio();
    if (audio && audio.state === "suspended") audio.resume();
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    nes = makeNes();
    nes.loadROM(bin);
    if (!running) { running = true; lastTime = 0; acc = 0; requestAnimationFrame(tick); }
    canvas.focus();
  }

  const KEYS = { ArrowUp: 4, ArrowDown: 5, ArrowLeft: 6, ArrowRight: 7, KeyX: 0, KeyZ: 1, ShiftLeft: 2, ShiftRight: 2, Enter: 3 };
  function key(e, down) {
    const b = KEYS[e.code];
    if (b === undefined || !nes) return;
    e.preventDefault();
    down ? nes.buttonDown(1, b) : nes.buttonUp(1, b);
  }
  canvas.addEventListener("keydown", (e) => key(e, true));
  canvas.addEventListener("keyup", (e) => key(e, false));

  // ---------------------------------------------------------------- compile
  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = "status " + (cls || ""); }

  async function compileAndRun() {
    setStatus("编译中…");
    let res;
    try {
      const r = await fetch("/api/compile", { method: "POST", headers: { "Content-Type": "text/plain; charset=utf-8" }, body: src.value });
      res = await r.json();
    } catch (e) {
      setStatus("无法连接 nesc serve", "err");
      return;
    }
    problems.innerHTML = "";
    errorLines.clear();
    if (!res.ok) {
      for (const err of res.errors) {
        errorLines.add(err.line);
        const div = document.createElement("div");
        div.className = "e";
        div.textContent = `${err.line}:${err.col}  ${err.message}`;
        div.onclick = () => gotoLine(err.line, err.col);
        problems.appendChild(div);
      }
      setStatus(`${res.errors.length} 个错误`, "err");
      showTab("problems");
      refresh();
      return;
    }
    refresh();
    const bin = atob(res.rom);
    romBytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) romBytes[i] = bin.charCodeAt(i);
    $("download").disabled = false;
    asmPanel.textContent = res.asm;
    const ok = document.createElement("div");
    ok.className = "ok";
    ok.textContent = `✓ 编译成功：ROM ${romBytes.length} 字节，PRG 已用 ${res.prg_used} / 32762 字节`;
    problems.appendChild(ok);
    setStatus("运行中", "ok");
    startRom(romBytes);
  }

  $("run").onclick = compileAndRun;
  $("download").onclick = () => {
    if (!romBytes) return;
    const name = ($("examples").value || "game") + ".nes";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([romBytes], { type: "application/octet-stream" }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "🔇 静音" : "🔊 声音"; };

  function showTab(name) {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
    problems.hidden = name !== "problems";
    asmPanel.hidden = name !== "asm";
  }
  document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));

  $("examples").onchange = (e) => {
    const ex = examples.find((x) => x.name === e.target.value);
    if (ex) { src.value = ex.source; errorLines.clear(); refresh(); compileAndRun(); }
  };

  fetch("/api/examples").then((r) => r.json()).then((list) => {
    examples = list;
    for (const ex of list) {
      const o = document.createElement("option");
      o.value = o.textContent = ex.name;
      $("examples").appendChild(o);
    }
    let saved = null;
    try { saved = localStorage.getItem("nesl-source"); } catch (e) {}
    src.value = saved || (list[0] && list[0].source) || "fn main() {\n}\n";
    refresh();
  });
  refresh();
})();
</script>
</body>
</html>
